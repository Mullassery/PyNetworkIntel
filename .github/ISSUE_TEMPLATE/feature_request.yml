name: Feature request
description: Suggest an idea or enhancement for PyNetworkIntel
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that PyNetworkIntel doesn't currently support?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other tools you've tried.

  - type: markdown
    attributes:
      value: |
        Note: enterprise-platform features (multitenancy, HA, auth, REST
        API) and a conversational architecture advisor are explicitly out
        of scope for this project - see the README's "Use cases" and
        "Module status" sections.
