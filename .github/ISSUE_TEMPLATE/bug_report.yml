name: Bug report
description: Report a problem with PyNetworkIntel
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: this tool actively scans networks. Please don't
        attach scan output/logs containing IPs, hostnames, or credentials
        for networks you don't want to disclose publicly - redact them.

  - type: input
    id: version
    attributes:
      label: PyNetworkIntel version
      description: Output of `pynetworkintel --version` or `pip show pynetworkintel`
      placeholder: "1.4.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.11.6"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15 / Ubuntu 24.04 / etc."
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you run, what did you expect, what actually happened?
      placeholder: |
        Command: pynetworkintel scan 192.0.2.0/24 --output json
        Expected: ...
        Actual: ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output / traceback
      description: Redact any real IPs, hostnames, or credentials first.
      render: shell

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I have redacted any sensitive network details (IPs, hostnames, credentials) from the report above.
          required: true
