<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CodeAtlas</title>
<script src="https://unpkg.com/cytoscape@3.23.0/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://unpkg.com/cytoscape-dagre@2.4.0/cytoscape-dagre.js"></script>
<style>
  body { margin: 0; font-family: -apple-system, sans-serif; }
  #cy { width: 100vw; height: 100vh; }
  header { padding: 12px 16px; border-bottom: 1px solid #eee; }
</style>
</head>
<body>
<header>
  <strong>CodeAtlas</strong>
  <p>Owns 223 symbols across 16 file(s).</p>
</header>
<div id="cy"></div>
<script>
const data = {"nodes": [{"data": {"id": "analysis", "label": "analysis", "description": "Owns 25 symbols across 4 file(s)."}}, {"data": {"id": "architect", "label": "architect", "description": "Owns 77 symbols across 8 file(s)."}}, {"data": {"id": "cloud", "label": "cloud", "description": "Owns 71 symbols across 6 file(s)."}}, {"data": {"id": "devops", "label": "devops", "description": "Owns 41 symbols across 5 file(s)."}}, {"data": {"id": "discovery", "label": "discovery", "description": "Owns 23 symbols across 3 file(s)."}}, {"data": {"id": "enterprise", "label": "enterprise", "description": "Owns 99 symbols across 7 file(s)."}}, {"data": {"id": "iot", "label": "iot", "description": "Owns 41 symbols across 4 file(s)."}}, {"data": {"id": "kubernetes", "label": "kubernetes", "description": "Owns 52 symbols across 5 file(s)."}}, {"data": {"id": "ml", "label": "ml", "description": "Owns 46 symbols across 4 file(s)."}}], "edges": [{"data": {"id": "edge_0", "source": "pynetworkintel", "target": "analysis", "label": "calls"}}, {"data": {"id": "edge_1", "source": "pynetworkintel", "target": "discovery", "label": "calls"}}, {"data": {"id": "edge_2", "source": "analysis", "target": "pynetworkintel", "label": "calls"}}, {"data": {"id": "edge_3", "source": "architect", "target": "pynetworkintel", "label": "calls"}}, {"data": {"id": "edge_4", "source": "cloud", "target": "pynetworkintel", "label": "calls"}}, {"data": {"id": "edge_5", "source": "devops", "target": "pynetworkintel", "label": "calls"}}, {"data": {"id": "edge_6", "source": "discovery", "target": "pynetworkintel", "label": "calls"}}, {"data": {"id": "edge_7", "source": "enterprise", "target": "pynetworkintel", "label": "calls"}}, {"data": {"id": "edge_8", "source": "iot", "target": "pynetworkintel", "label": "calls"}}, {"data": {"id": "edge_9", "source": "kubernetes", "target": "pynetworkintel", "label": "calls"}}]};
const cy = cytoscape({
  container: document.getElementById('cy'),
  elements: data,
  style: [
    { selector: 'node', style: {
      'label': 'data(label)',
      'shape': 'round-rectangle',
      'background-color': '#eef2ff',
      'border-color': '#6366f1',
      'border-width': 1,
      'width': 'label',
      'padding': '10px',
      'text-valign': 'center',
      'text-halign': 'center',
      'font-size': '12px',
    }},
    { selector: 'edge', style: {
      'label': 'data(label)',
      'curve-style': 'bezier',
      'target-arrow-shape': 'triangle',
      'font-size': '10px',
      'text-rotation': 'autorotate',
    }}
  ],
  layout: { name: 'dagre', rankDir: 'LR' }
});
cy.on('tap', 'node', evt => {
  const node = evt.target;
  if (node.data('linkUrl')) { window.location.href = node.data('linkUrl'); }
});
</script>
</body>
</html>
