[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pynetworkintel"
version = "1.4.0"
description = "AI-powered network intelligence and vulnerability discovery platform"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "Georgi Mullassery", email = "mullassery@gmail.com"}
]
keywords = [
    "network",
    "security",
    "vulnerability",
    "scanning",
    "discovery",
    "monitoring",
    "artificial-intelligence"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking",
    "Topic :: Security",
]
requires-python = ">=3.10"
dependencies = [
    "paramiko>=3.0,<4.0",
    "netaddr>=0.9,<1.4",
    "pyyaml>=6.0,<7.0",
    "requests>=2.31,<3.0",
    "anthropic>=0.25,<1.0",
    "rich>=13.0,<14.0",
    "sqlalchemy>=2.0,<3.0",
    "apscheduler>=3.10,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9.0",
    "pytest-cov>=4.1,<7.0",
    "black>=23.7,<25.0",
    "ruff>=0.0.280,<0.9",
    "build>=0.10,<2.0",
    "twine>=4.0,<7.0",
]
# Optional SDKs for the (real, shipped, but lighter-tested) cloud/ and
# kubernetes/ discovery modules. Both modules lazy-import these and degrade
# to a logged warning if absent, so they are not part of the core install.
cloud = [
    "boto3>=1.28,<2.0",
    "azure-identity>=1.14,<2.0",
    "azure-mgmt-compute>=30.0,<32.0",
    "azure-mgmt-network>=25.0,<27.0",
    "azure-mgmt-storage>=21.0,<23.0",
    "azure-mgmt-resource>=23.0,<24.0",
    "azure-mgmt-rdbms>=10.1,<11.0",
    "google-cloud-compute>=1.14,<2.0",
    "google-cloud-storage>=2.10,<3.0",
]
kubernetes = [
    "kubernetes>=27.0,<32.0",
]

[project.urls]
Homepage = "https://github.com/Mullassery/PyNetworkIntel"
Documentation = "https://github.com/Mullassery/PyNetworkIntel/blob/main/README.md"
"Source Code" = "https://github.com/Mullassery/PyNetworkIntel"
"Bug Tracker" = "https://github.com/Mullassery/PyNetworkIntel/issues"

[project.scripts]
pynetworkintel = "pynetworkintel.cli:main"

[tool.setuptools]
# NOTE: pynetworkintel.enterprise and pynetworkintel.architect are
# deliberately NOT packaged/distributed. They exist in the source tree but
# are unrelated to this tool's core purpose (network discovery, topology
# mapping, vulnerability scanning) - see README.md "Module status" for the
# full per-module rationale. They are not imported by anything in the
# packaged modules below, are untested, and are excluded from the wheel/
# sdist so they can't be mistaken for supported, shipped functionality.
packages = [
    "pynetworkintel",
    "pynetworkintel.discovery",
    "pynetworkintel.analysis",
    "pynetworkintel.cloud",
    "pynetworkintel.kubernetes",
    "pynetworkintel.iot",
    "pynetworkintel.ml",
    "pynetworkintel.devops",
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py310"
