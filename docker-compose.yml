services:
  pynetworkintel:
    build: .
    image: pynetworkintel:latest
    container_name: pynetworkintel
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ~/.ssh:/root/.ssh:ro
      - ~/.pynetworkintel:/root/.pynetworkintel
      - ./results:/app/results
    # Real host networking (not a custom "host"-driver network, which does
    # not give the container the host's actual network view) - required so
    # nmap can actually see the LAN being scanned.
    network_mode: host
    # Uncomment to keep container running for interactive use
    # stdin_open: true
    # tty: true
